name: Simulation and Laboratory tests

on:
  push:
    branches: [main, feature/simulation-laboratory-engine]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip numpy
      - run: python -m unittest discover -s tests -v
